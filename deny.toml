# cargo-deny policy (rules.md §5, NFR-SEC-03, R0-1).
# `just deny` runs `cargo deny check` (advisories, bans, licenses, sources) and then the
# network-ban probes in tests/security/netban-probe*/ that prove the ban fires.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[advisories]
# An ignore entry needs a written reason, a revisit condition and the owner's approval.
ignore = []

[licenses]
# rules.md §5 allowlist. Anything else needs an ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allowlist names licences for crates that arrive in later phases.
unused-allowed-license = "allow"
# ADR-0010 item 12 (owner approved 2026-11-16): build-time only, pulled in
# by gtk4's system-deps; the LLVM exception only adds permissions to Apache-2.0.
exceptions = [
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
    # ADR-0007 (owner accepted 2026-11-15, risk R-07, PRD §10): COSMIC's window protocol
    # bindings are GPL-3.0-only; used by C1 alone. R-07 closed by D-44 (2026-11-22): the
    # project itself is GPL-3.0-only, so binaries that include this crate are too.
    { allow = ["GPL-3.0-only"], crate = "cosmic-protocols" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# cargo-deny counts one syn version twice when it is built for both host proc-macros
# and the target; that is not a real duplicate.
skip = [{ crate = "syn", reason = "same version, host and target builds" }]

# NFR-SEC-03 / R0-1: no HTTP client, DNS resolver, websocket or telemetry SDK
# anywhere except C7 `octoplus-fetcher`. The entries C7 needs (the reqwest chain and
# hickory) carry `wrappers`: each is allowed only as a direct dependency of the fetcher,
# or of a crate that is itself banned everywhere but the fetcher. Everything else stays
# banned outright; scripts/check-netban.sh proves the ban still fires for other crates.
deny = [
    # HTTP clients
    { crate = "reqwest", reason = "HTTP client (NFR-SEC-03)", wrappers = ["octoplus-fetcher"] },
    { crate = "hyper", reason = "HTTP stack (NFR-SEC-03)", wrappers = ["reqwest", "hyper-util", "hyper-rustls"] },
    { crate = "hyper-util", reason = "HTTP stack (NFR-SEC-03)", wrappers = ["reqwest", "hyper-rustls"] },
    { crate = "hyper-rustls", reason = "HTTP stack (NFR-SEC-03)", wrappers = ["reqwest"] },
    { crate = "h2", reason = "HTTP/2 stack (NFR-SEC-03)" },
    { crate = "ureq", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "curl", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "curl-sys", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "isahc", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "attohttpc", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "surf", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "minreq", reason = "HTTP client (NFR-SEC-03)" },
    { crate = "awc", reason = "HTTP client (NFR-SEC-03)" },
    # DNS resolvers
    { crate = "hickory-resolver", reason = "DNS resolver (NFR-SEC-03)", wrappers = ["octoplus-fetcher"] },
    { crate = "hickory-proto", reason = "DNS (NFR-SEC-03)", wrappers = ["hickory-resolver", "hickory-net"] },
    { crate = "hickory-net", reason = "DNS (NFR-SEC-03)", wrappers = ["hickory-resolver"] },
    { crate = "trust-dns-resolver", reason = "DNS resolver (NFR-SEC-03)" },
    { crate = "trust-dns-proto", reason = "DNS (NFR-SEC-03)" },
    { crate = "async-std-resolver", reason = "DNS resolver (NFR-SEC-03)" },
    { crate = "c-ares", reason = "DNS resolver (NFR-SEC-03)" },
    # Websockets
    { crate = "tungstenite", reason = "network protocol (R0-1)" },
    { crate = "tokio-tungstenite", reason = "network protocol (R0-1)" },
    # Telemetry / crash reporting (rules.md §10.2.1)
    { crate = "sentry", reason = "telemetry (R0-1)" },
    { crate = "opentelemetry", reason = "telemetry (R0-1)" },
    { crate = "opentelemetry-otlp", reason = "telemetry (R0-1)" },
    { crate = "tracing-opentelemetry", reason = "telemetry (R0-1)" },
    # rules.md §5: jiff, not chrono
    { crate = "chrono", reason = "use jiff (rules.md §5)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
