# Negative control for the network-crate ban (P0-S05, NFR-SEC-03).
# This crate is NOT part of the build. `scripts/check-netban.sh` runs cargo-deny on it
# with the real deny.toml and FAILS unless every banned crate below is reported.
[package]
name = "neuroos-netban-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ureq = { version = "3", default-features = false }
hickory-resolver = { version = "0.26", default-features = false }

[workspace]

[package.metadata.cargo-machete]
ignored = ["ureq", "hickory-resolver"]
