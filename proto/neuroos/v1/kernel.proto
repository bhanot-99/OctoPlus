// C6 neuroos-kernel (PRD §5.9). Envelope range 160–199.
syntax = "proto3";
package neuroos.v1;

import "neuroos/v1/common.proto";

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_SAFE = 1;
  TIER_REVIEW = 2;
  TIER_DANGEROUS = 3;
}

// FR-KER-03, FR-KNO-07: may this capability run in this taint context?
message EvaluateRequest {
  string capability = 1;
  Taint context_taint = 2;
}

message EvaluateResult {
  Tier tier = 1;
  bool allowed_without_dialog = 2;
}

message DispatchRequest {
  string skill = 1;
  string args_json = 2;
  Taint context_taint = 3;
  Origin origin = 4;
}

enum DispatchStatus {
  DISPATCH_STATUS_UNSPECIFIED = 0;
  DISPATCH_STATUS_EXECUTED = 1;
  DISPATCH_STATUS_REJECTED = 2;
  DISPATCH_STATUS_EXPIRED = 3;
  DISPATCH_STATUS_FAILED = 4;
}

message DispatchResult {
  DispatchStatus status = 1;
  string result_json = 2;
  Tier tier = 3;
  Taint result_taint = 4;
}

// FR-NUD-12: notifications are rendered by C6 from a template id and numbers.
message NotifyRequest {
  string template_id = 1;
  repeated TemplateArg args = 2;
}

message AuditTailRequest {
  uint32 limit = 1;
}

// One audit line as stored (metadata only).
message AuditRecord {
  uint64 seq = 1;
  uint64 at_ns = 2;
  string kind = 3;          // ATTEMPT | RESULT
  string skill = 4;
  string status = 5;
  string record_hash = 6;
}

message AuditRecords {
  repeated AuditRecord records = 1;
}

message AuditVerifyRequest {}

message AuditVerifyResult {
  bool chain_ok = 1;
  uint64 records_checked = 2;
  uint64 first_bad_seq = 3;
}

message EgressListRequest {
  uint32 limit = 1;
}

message EgressRecord {
  uint64 at_ns = 1;
  string host = 2;
  string sent_text = 3;
  uint64 bytes_out = 4;
  uint64 bytes_in = 5;
}

message EgressRecords {
  repeated EgressRecord records = 1;
}
