// Per-part health endpoint (FR-HLT-02, Architecture §6.6). Envelope range: common.
syntax = "proto3";
package neuroos.v1;

enum HealthStatus {
  // Never sent on purpose; a receiver treats it as an error.
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_OK = 1;
  // A subsystem is stopped or failing; the part still answers (FR-HLT-02).
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_DOWN = 3;
  HEALTH_STATUS_STARTING = 4;
}

message HealthRequest {}

message SubsystemHealth {
  string name = 1;
  HealthStatus status = 2;
  // Short fixed reason, never user content.
  string detail = 3;
}

message Counter {
  string name = 1;
  uint64 value = 2;
}

message Gauge {
  string name = 1;
  double value = 2;
}

// Latency histogram: counts[i] is the number of samples <= upper_bounds_ns[i];
// the last count is the overflow bucket, so counts has one more entry than bounds.
message Histogram {
  string name = 1;
  repeated uint64 upper_bounds_ns = 2;
  repeated uint64 counts = 3;
  uint64 sample_count = 4;
  uint64 sum_ns = 5;
}

message HealthResponse {
  string component = 1;
  string version = 2;
  HealthStatus status = 3;
  uint64 started_at_ns = 4;
  uint64 sampled_at_ns = 5;
  uint64 rss_bytes = 6;
  repeated SubsystemHealth subsystems = 7;
  repeated Counter counters = 8;
  repeated Gauge gauges = 9;
  repeated Histogram histograms = 10;
}
