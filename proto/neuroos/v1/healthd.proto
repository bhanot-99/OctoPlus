// neuroos-healthd (PRD §5.11). Envelope range 220–239.
syntax = "proto3";
package neuroos.v1;

import "neuroos/v1/health.proto";

message StatusRequest {}

message PartStatus {
  string part = 1;
  bool reachable = 2;
  HealthResponse last = 3;
  uint64 last_scrape_ns = 4;
  uint64 cgroup_memory_bytes = 5;
  uint64 cgroup_cpu_usage_ns = 6;
}

message StatusReport {
  HealthStatus overall = 1;
  repeated PartStatus parts = 2;
  uint64 generated_at_ns = 3;
}
