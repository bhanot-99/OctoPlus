// C4 neuroos-inference (PRD §5.8). Envelope range 100–119.
// A Generate request is answered by a stream of TokenChunk frames and one
// GenerateDone frame with end_of_stream = true (AB-12), also on cancel and error.
syntax = "proto3";
package neuroos.v1;

message GenerateRequest {
  string prompt = 1;
  uint32 max_tokens = 2;
  string grammar = 3;          // GBNF; empty means free text (FR-INF-05)
  bool interactive = 4;        // a new interactive request cancels the old one (FR-INF-04)
  uint32 stable_prefix_chars = 5;  // length of the cacheable prefix (FR-INF-06)
}

message TokenChunk {
  string text = 1;
  uint32 tokens = 2;
}

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  STOP_REASON_END_OF_TEXT = 1;
  STOP_REASON_MAX_TOKENS = 2;
  STOP_REASON_CANCELLED = 3;
  STOP_REASON_CONTEXT_FULL = 4;
  STOP_REASON_ERROR = 5;
}

enum ComputePath {
  COMPUTE_PATH_UNSPECIFIED = 0;
  COMPUTE_PATH_CPU = 1;
  COMPUTE_PATH_GPU = 2;
}

message GenerateDone {
  StopReason reason = 1;
  uint32 prompt_tokens = 2;
  uint32 cached_prompt_tokens = 3;
  uint32 generated_tokens = 4;
  uint64 prefill_ns = 5;
  uint64 decode_ns = 6;
  ComputePath path = 7;
}

// FR-INF-07.
message BenchRequest {
  uint32 prompt_tokens = 1;
  uint32 generate_tokens = 2;
  uint32 repetitions = 3;
}

message BenchResult {
  uint64 time_to_first_token_ns = 1;
  double prefill_tokens_per_s = 2;
  double decode_tokens_per_s = 3;
  uint64 rss_bytes = 4;
  ComputePath path = 5;
}
