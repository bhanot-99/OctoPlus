// C3 neuroos-storage (PRD §5.3). Envelope range 60–99.
syntax = "proto3";
package neuroos.v1;

import "neuroos/v1/common.proto";
import "neuroos/v1/monitor.proto";

enum Domain {
  DOMAIN_UNSPECIFIED = 0;
  DOMAIN_WINDOW_FOCUS = 1;
  DOMAIN_APP_LIFECYCLE = 2;
  DOMAIN_IDLE_PRESENCE = 3;
  DOMAIN_PROCESS_ACTIVITY = 4;
  DOMAIN_BUILD_JOB = 5;
  DOMAIN_GIT_ACTIVITY = 6;
  DOMAIN_NOTES = 7;
  DOMAIN_CALENDAR = 8;
  DOMAIN_MEDIA_PLAYBACK = 9;
  DOMAIN_SYSTEM_HEALTH = 10;
  DOMAIN_VOICE_INTERACTION = 11;
  DOMAIN_ASSISTANT_ACTIONS = 12;
  DOMAIN_USER_PROFILE = 13;
  DOMAIN_EXTERNAL_DOCUMENTS = 14;
}

message FocusWindow {
  string app_id = 1;
  string title = 2;
  uint64 start_ns = 3;
  uint64 end_ns = 4;
  bool contains_instant = 5;   // false when this is the nearest edge (FR-STO-07)
}

// FR-STO-07.
message QueryFocusHistory {
  uint64 at_ns = 1;
  uint64 window_ns = 2;
}

message FocusHistoryResult {
  repeated FocusWindow windows = 1;
}

message Evidence {
  uint64 chunk_id = 1;
  Domain domain = 2;
  string text = 3;
  double score = 4;
  Taint taint = 5;
  uint64 at_ns = 6;
  string source = 7;
}

// FR-STO-05.
message QueryHybrid {
  string text = 1;
  uint32 top_k = 2;
  double min_score = 3;
  repeated Domain domains = 4;
}

message HybridResult {
  repeated Evidence evidence = 1;
  bool stale_index = 2;
}

// FR-STO-08.
message QueryActivity {
  uint64 from_ns = 1;
  uint64 to_ns = 2;
}

message ActivityItem {
  Domain domain = 1;
  string label = 2;
  uint64 start_ns = 3;
  uint64 end_ns = 4;
  Taint taint = 5;
}

message ActivityResult {
  repeated ActivityItem items = 1;
}

// FR-STO-09.
message QueryHealthSignals {
  uint64 since_ns = 1;
}

message HealthSignals {
  repeated MonitorEvent samples = 1;
  bool idle = 2;
  bool locked = 3;
  bool fullscreen = 4;
  bool media_playing = 5;
  uint64 active_since_ns = 6;
  bool locked_known = 7;     // false in v1.0: lock state is unknown (ADR-0011); `locked` is then meaningless
}

// C5 -> C3 after a turn (domain voice_interaction).
message StoreInteraction {
  string question = 1;
  string answer_summary = 2;
  Taint taint = 3;
  uint64 at_ns = 4;
  Origin origin = 5;
}

enum NudgeOutcome {
  NUDGE_OUTCOME_UNSPECIFIED = 0;
  NUDGE_OUTCOME_SPOKEN = 1;
  NUDGE_OUTCOME_NOTIFIED = 2;
  NUDGE_OUTCOME_HELD = 3;
  NUDGE_OUTCOME_DROPPED = 4;
  NUDGE_OUTCOME_ACCEPTED = 5;
  NUDGE_OUTCOME_DISMISSED = 6;
  NUDGE_OUTCOME_IGNORED = 7;
  NUDGE_OUTCOME_SNOOZED = 8;      // "not now": the rule is quiet for the snooze time (FR-NUD-09)
  NUDGE_OUTCOME_DISABLED = 9;     // "stop telling me" or `nudges disable`; kept past retention
  NUDGE_OUTCOME_ENABLED = 10;     // switched back on; kept past retention
  NUDGE_OUTCOME_ENGINE_IDLE = 11; // the engine could not read C3 and idled
}

// FR-NUD-11.
message StoreNudgeLog {
  string rule_id = 1;
  NudgeOutcome outcome = 2;
  uint64 at_ns = 3;
}

// FR-STO-13 via C6 (REVIEW).
message ForgetRequest {
  uint64 from_ns = 1;
  uint64 to_ns = 2;
  string app_id = 3;
}

message ForgetResult {
  uint64 rows_deleted = 1;
  uint64 vectors_deleted = 2;
}

message ProfileFact {
  uint64 id = 1;
  string text = 2;
  uint64 saved_at_ns = 3;
  Taint taint = 4;
}

message ProfileListRequest {
  string relevant_to = 1;   // empty lists all
}

message ProfileFacts {
  repeated ProfileFact facts = 1;
}

message ProfileAdd {
  string text = 1;
  Taint taint = 2;
}

message ProfileRemove {
  repeated uint64 ids = 1;
}

enum LifecycleJob {
  LIFECYCLE_JOB_UNSPECIFIED = 0;
  LIFECYCLE_JOB_GC = 1;
  LIFECYCLE_JOB_BACKUP = 2;
  LIFECYCLE_JOB_ROLLUP = 3;
  LIFECYCLE_JOB_PURGE = 4;   // FR-PRV-06: removes every byte of user data; kernel only (ADR-0012)
}

message RunLifecycleJob {
  LifecycleJob job = 1;
}

message LifecycleResult {
  LifecycleJob job = 1;
  uint64 duration_ns = 2;
  uint64 items = 3;
}

// C5 -> C3 at start: rebuild cooldowns, snoozes and switches from the log (ADR-0014).
message QueryNudgeLog {
  uint64 since_ns = 1;
}

message NudgeLogEntry {
  string rule_id = 1;
  NudgeOutcome outcome = 2;
  uint64 at_ns = 3;
}

// Newest last. Every ENABLED and DISABLED row is returned whatever `since_ns` says, so a switch
// outlives log retention.
message NudgeLogEntries {
  repeated NudgeLogEntry entries = 1;
}
