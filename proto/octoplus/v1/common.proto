// Shared types (Architecture §5.3). Envelope field range 10–19.
// Rules: every timestamp is u64 UTC epoch nanoseconds (AB-8); no message carries
// user content in an error string (rules.md §6.3).
syntax = "proto3";
package octoplus.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_REQUEST = 1;
  ERROR_CODE_DEADLINE_EXCEEDED = 2;
  ERROR_CODE_UNAVAILABLE = 3;
  ERROR_CODE_CANCELLED = 4;
  ERROR_CODE_PERMISSION_DENIED = 5;
  ERROR_CODE_RESOURCE_EXHAUSTED = 6;
  ERROR_CODE_INTERNAL = 7;
  ERROR_CODE_UNSUPPORTED_VERSION = 8;
  ERROR_CODE_NOT_FOUND = 9;
  ERROR_CODE_FRAME_TOO_LARGE = 10;
  ERROR_CODE_BUSY = 11;
}

// Failure of one request. `message` never contains user content.
message Error {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

// Asks the server to stop work on an earlier request. The server still ends that
// request's stream with an end frame (AB-12).
message Cancel {
  uint64 target_request_id = 1;
}

// Liveness and IPC measurement (spike S-03). Echoed unchanged.
message Ping {
  bytes payload = 1;
}

message Pong {
  bytes payload = 1;
}

// Success with no data.
message Ack {}

// Taint flags (Architecture §7.4). Always a message field so absence is visible:
// a missing Taint is an error, never "clean" (R0-4).
message Taint {
  uint32 flags = 1;
}

// A named number for template-rendered text (nudges, notifications). Only numbers,
// never free text (R0-6, FR-NUD-04, FR-NUD-12).
message TemplateArg {
  string name = 1;
  double value = 2;
}

// Where a turn came from.
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_VOICE = 1;
  ORIGIN_CLI = 2;
  ORIGIN_NUDGE_REPLY = 3;
}
