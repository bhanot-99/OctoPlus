// C7 octoplus-fetcher (PRD §5.10). Envelope range 200–219. Only C6 may connect.
syntax = "proto3";
package octoplus.v1;

// HMAC-SHA256 approval bound to exactly one request (FR-KER-04, FR-FET-02).
message ApprovalToken {
  bytes nonce = 1;
  uint64 expires_at_ns = 2;
  bytes mac = 3;
  bytes action_id = 4;
}

message FetchRequest {
  string url = 1;
  ApprovalToken token = 2;
}

message SearchRequest {
  string query = 1;
  uint32 max_pages = 2;
  ApprovalToken token = 3;
}

message EgressEntry {
  string host = 1;
  string sent_text = 2;
  uint64 bytes_out = 3;
  uint64 bytes_in = 4;
  uint64 at_ns = 5;
}

message FetchResult {
  repeated EgressEntry egress = 1;
  repeated string spool_files = 2;
}
