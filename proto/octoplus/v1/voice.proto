// C2 octoplus-voice (PRD §5.1). Envelope range 40–59.
syntax = "proto3";
package octoplus.v1;

import "octoplus/v1/common.proto";

// C2 -> C5 after the wake word or inside the follow-up window (FR-VOI-04).
message VoiceCommand {
  string text = 1;
  uint64 t_speech_start_ns = 2;
  uint64 t_speech_end_ns = 3;
  bool in_follow_up = 4;
  string nudge_rule_id = 5;     // set when this replies to a nudge
  bool in_session = 6;          // this spoken turn is inside an open-microphone session
}

enum PreambleKind {
  PREAMBLE_KIND_UNSPECIFIED = 0;
  PREAMBLE_KIND_THINKING = 1;
  PREAMBLE_KIND_LOOKING = 2;
  PREAMBLE_KIND_ACKNOWLEDGE = 3;
  PREAMBLE_KIND_BACKCHANNEL = 4; // a short "mm" or "oh" sound
}

// C5 -> C2: play a cached preamble now (FR-VOI-05).
message PreambleRequest {
  PreambleKind kind = 1;
}

// C5 -> C2: one sentence of an answer, streamed (FR-VOI-06, FR-KNO-08).
message SpeakChunk {
  string text = 1;
  uint32 sequence = 2;
}

// C5 -> C2: an unprompted line from a fixed template and numbers (FR-VOI-11, R0-6).
message SpeakNudge {
  string rule_id = 1;
  string template_id = 2;
  repeated TemplateArg args = 3;
}

enum StatusLine {
  STATUS_LINE_UNSPECIFIED = 0;
  STATUS_LINE_PART_UNAVAILABLE = 1;
  STATUS_LINE_NOT_SURE = 2;
  STATUS_LINE_ERROR = 3;
}

// C5 -> C2: play a cached status clip (FR-KNO-10).
message SpeakStatus {
  StatusLine line = 1;
}

// C2 -> C5: the user spoke during playback (FR-VOI-07).
message BargeIn {
  uint64 at_ns = 1;
}

message VoiceStatusRequest {}

// A user-run client (OctoPit's mic button, ADR-0017) opens or closes the same capture the wake
// word opens. It carries no audio and no text; C2 owns every sample.
enum VoiceControlAction {
  VOICE_CONTROL_ACTION_UNSPECIFIED = 0;
  // Start capturing a command now, as if the wake phrase had just been heard.
  VOICE_CONTROL_ACTION_START_LISTENING = 1;
  // Stop capturing and answer what was said so far.
  VOICE_CONTROL_ACTION_STOP_LISTENING = 2;
  // Drop the turn: discard the capture, stop speaking, cancel the request.
  VOICE_CONTROL_ACTION_CANCEL = 3;
  // End active open-mic session.
  VOICE_CONTROL_ACTION_END_SESSION = 4;
  // Start an open-mic session now.
  VOICE_CONTROL_ACTION_START_SESSION = 5;
  // Enable guest mode (silence for guest_minutes).
  VOICE_CONTROL_ACTION_GUEST_MODE = 6;
  // Disable guest mode.
  VOICE_CONTROL_ACTION_GUEST_OFF = 7;
}

message VoiceControl {
  VoiceControlAction action = 1;
}

// FR-VOI-10.
message VoiceStatus {
  bool turn_in_progress = 1;
  bool speaking = 2;
  bool follow_up_open = 3;
  bool mic_in_use_by_other = 4;
  bool capture_running = 5;
  // The exact stage of the turn, for a live indicator (`octoplusctl voice watch`).
  TurnPhase phase = 6;
  // Wake phrases heard since the service started: a wake that led nowhere still counts.
  uint64 wake_words = 7;
  // How loud the microphone is right now, 0..1000, for a level meter. Only a number: no audio.
  uint32 input_level_permille = 8;
  bool session_active = 9;
  uint32 session_seconds_left = 10;
  uint32 guest_seconds_left = 11;
  uint64 sessions_started = 12;
}

// Where a turn is. Matches the turn machine's states (IDLE = nothing happening).
enum TurnPhase {
  TURN_PHASE_IDLE = 0;
  TURN_PHASE_CAPTURING = 1;       // the wake phrase was heard; the question is being recorded
  TURN_PHASE_TRANSCRIBING = 2;    // speech is being turned into text
  TURN_PHASE_AWAITING_ANSWER = 3; // C5 and C4 are working on the answer
  TURN_PHASE_SPEAKING = 4;
  TURN_PHASE_FOLLOW_UP = 5;       // the follow-up window is open
}
