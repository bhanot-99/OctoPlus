# --- ONNX Runtime 1.31.1 (CPU), loaded dynamically by C3 (ADR-0012). install-dev.sh unpacks
# lib/libonnxruntime.so.1.31.1 into ~/.local/opt/neuroos/lib.

[[model]]
id = "runtime-onnxruntime-1.31.1-linux-x64"
