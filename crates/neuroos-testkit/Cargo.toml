[package]
name = "neuroos-testkit"
description = "Test fixtures: the neuroos-echo service and helpers for running real units"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neuroos-echo"
path = "src/bin/neuroos-echo.rs"

[[bin]]
name = "neuroos-monitor-tail"
path = "src/bin/neuroos-monitor-tail.rs"

[[bin]]
name = "neuroos-synth-dump"
path = "src/bin/neuroos-synth-dump.rs"

[[bin]]
name = "neuroos-s04-probe"
path = "src/bin/neuroos-s04-probe.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
neuroos-common = { path = "../neuroos-common" }
neuroos-health = { path = "../neuroos-health" }
neuroos-ipc = { path = "../neuroos-ipc" }
neuroos-proto = { path = "../neuroos-proto" }
neuroos-sandbox = { path = "../neuroos-sandbox" }
rustix = { workspace = true, features = ["mm", "net", "thread"] }
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

[dev-dependencies]
neuroos-deploy = { path = "../neuroos-deploy" }
tempfile.workspace = true

[lints]
workspace = true
