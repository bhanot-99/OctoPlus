[package]
name = "octoplus-storage"
description = "OctoPlus Storage Engine (C3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "octoplus-storage"
path = "src/main.rs"

[dependencies]
octoplus-common = { path = "../octoplus-common" }
octoplus-health = { path = "../octoplus-health" }
octoplus-ipc = { path = "../octoplus-ipc" }
octoplus-proto = { path = "../octoplus-proto" }
octoplus-taint = { path = "../octoplus-taint" }
ort.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }

[features]
# Test helpers (a handler without per-message unit checks); never in the shipped binary.
test-support = []

[dev-dependencies]
octoplus-storage = { path = ".", features = ["test-support"] }
octoplus-health = { path = "../octoplus-health", features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
