[package]
name = "neuroos-skill"
description = "Semantic-NeuroOS skill child: runs one skill in its own sandbox (C6, FR-KER-05)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neuroos-skill"
path = "src/main.rs"

# Test-only escape probe (security.md §8 "Skill sandbox"). Never installed:
# scripts/install-dev.sh copies an explicit list that does not include it.
[[bin]]
name = "neuroos-skill-probe"
path = "src/bin/probe.rs"

[dependencies]
neuroos-sandbox = { path = "../neuroos-sandbox" }
rustix = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
