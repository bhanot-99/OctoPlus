[package]
name = "neuroos-storage"
description = "Semantic-NeuroOS Storage Engine (C3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neuroos-storage"
path = "src/main.rs"

[dependencies]
neuroos-common = { path = "../neuroos-common" }
neuroos-health = { path = "../neuroos-health" }
neuroos-ipc = { path = "../neuroos-ipc" }
neuroos-proto = { path = "../neuroos-proto" }
neuroos-taint = { path = "../neuroos-taint" }
ort.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
neuroos-health = { path = "../neuroos-health", features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
