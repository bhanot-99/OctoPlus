[package]
name = "neuroos-monitor"
description = "Semantic-NeuroOS Context Monitor (C1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neuroos-monitor"
path = "src/main.rs"

[dependencies]
neuroos-common = { path = "../neuroos-common" }
neuroos-health = { path = "../neuroos-health" }
neuroos-ipc = { path = "../neuroos-ipc" }
neuroos-proto = { path = "../neuroos-proto" }
cosmic-protocols.workspace = true
rustix.workspace = true
clap.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }

[dev-dependencies]
neuroos-health = { path = "../neuroos-health", features = ["test-support"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
