[package]
name = "neuroos-knowledge"
description = "Semantic-NeuroOS Knowledge and Nudge Engine (C5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neuroos-knowledge"
path = "src/main.rs"

[[bin]]
name = "nudge-replay"
path = "src/bin/nudge-replay.rs"

[dependencies]
neuroos-common = { path = "../neuroos-common" }
neuroos-health = { path = "../neuroos-health" }
neuroos-ipc = { path = "../neuroos-ipc" }
neuroos-proto = { path = "../neuroos-proto" }
neuroos-taint = { path = "../neuroos-taint" }
tokio = { workspace = true, features = ["sync", "time"] }
jiff.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
neuroos-health = { path = "../neuroos-health", features = ["test-support"] }
neuroos-testkit = { path = "../neuroos-testkit" }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
