[package]
name = "octoplus-confirm"
description = "OctoPlus confirmation dialog (C6 child, design.md §6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The GTK window. C6 depends on this crate with default features off, so it gets
# the stdin/stdout contract without linking GTK (Architecture §8.4).
default = ["gui"]
gui = ["dep:gtk4"]

[[bin]]
name = "octoplus-confirm"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
gtk4 = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
