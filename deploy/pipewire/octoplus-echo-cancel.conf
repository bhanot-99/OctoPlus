# PipeWire echo cancellation for the buddy's voice (Phase 7, ADR-0015 item 5).
#
# Without it the buddy's own voice can come back through the microphone and, if the speakers are
# loud, interrupt itself. This drop-in makes a virtual microphone and speaker pair that remove
# what the speaker plays from what the microphone hears (the WebRTC canceller that ships with
# PipeWire). It changes nothing else: your default devices stay as they are.
#
# Install:  scripts/voice-echo-cancel.sh enable      (copies this file, restarts PipeWire's user session)
# Then in ~/.config/octoplus/voice.conf:
#     capture_node  = octoplus_echo_source
#     playback_node = octoplus_echo_sink
# Remove:   scripts/voice-echo-cancel.sh disable
context.modules = [
  {
    name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      node.latency = 1024/48000
      monitor.mode = false
      aec.args = {
        webrtc.gain_control = false
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
        webrtc.noise_suppression = true
      }
      capture.props = {
        node.name = octoplus_echo_capture
        node.passive = true
      }
      source.props = {
        node.name = octoplus_echo_source
        media.class = Audio/Source
        node.description = "Buddy microphone (echo cancelled)"
      }
      sink.props = {
        node.name = octoplus_echo_sink
        media.class = Audio/Sink
        node.description = "Buddy speaker (echo cancelled)"
      }
      playback.props = {
        node.name = octoplus_echo_playback
        node.passive = true
      }
    }
  }
]
