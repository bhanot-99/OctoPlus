[workspace]
resolver = "3"
members = [
    "crates/neuroos-common",
    "crates/neuroos-confirm",
    "crates/neuroos-deploy",
    "crates/neuroos-fetcher",
    "crates/neuroos-health",
    "crates/neuroos-healthd",
    "crates/neuroos-ipc",
    "crates/neuroos-kernel",
    "crates/neuroos-knowledge",
    "crates/neuroos-monitor",
    "crates/neuroos-octopit",
    "crates/neuroos-octopit-core",
    "crates/neuroos-proto",
    "crates/neuroos-sandbox",
    "crates/neuroos-skill",
    "crates/neuroos-storage",
    "crates/neuroos-taint",
    "crates/neuroos-testkit",
    "crates/neuroosctl",
    "bench/ipc-stream",
    "bench/kernel-check",
    "bench/storage-scan",
]
# The network-ban probe and spike S-05 probe are separate workspaces so they never enter the real build (P0-S05, P0-S11).
exclude = ["tests/security/netban-probe", "tests/spikes/s05-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

# Only crates from the Architecture §14 allowlist, and only once a crate uses them. A new entry needs a justification (rules.md §5).
[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
jiff = "0.2.43"
landlock = "0.4.7"
prost = "0.14.6"
prost-build = "0.14.6"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustix = { version = "1.1.6", features = ["process", "fs", "param", "time", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
# Phase 2 (C6): crypto, ids, skill sandbox, notifications, dialog (Architecture §14 allowlist).
gtk4 = { version = "0.11.5", features = ["v4_14"] }
hmac = "0.13.0"
seccompiler = "0.5.0"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["v7"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio"] }
zeroize = { version = "1.9.1", features = ["derive"] }
# Phase 3 (C1): compositor focus and idle (ADR-0007; cosmic-protocols is GPL-3.0-only, isolated to C1, see deny.toml).
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# Phase 4 (C3): embedding. No `fastembed` (HTTP client, R0-1), no `tokenizers` (its hash-table crates fail cargo-deny: BSL-1.0, unmaintained fxhash; WordPiece is written by hand) and no `ort` binary download:
# the runtime is loaded from a pinned, hash-checked file (ADR-0012).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
# Phase 8 (C7 only, Architecture §14, ADR-0016): HTTPS client and resolver. cargo-deny bans
# them everywhere else (deny.toml `wrappers`). rustls on ring with the system's CA roots: no
# OpenSSL, no aws-lc, no bundled root list; no cookies, proxies or HTTP/2 (request hygiene, FR-FET-06).
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
url = "2.5.8"
# Tests
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"            # rules.md §7: only neuroos-sandbox and FFI shims may opt out
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"            # rules.md §6.1
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"           # rules.md §5: tracing, not println!, in services
print_stderr = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
panic = "abort"
